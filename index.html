<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f5"><meta name="apple-mobile-web-app-capable" content="yes"><title>あかりのまなび</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f5;color:#263547;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}.wrap{max-width:750px;margin:auto;padding:22px 16px 65px}header{font-size:25px;font-weight:800;margin-bottom:20px}.hero{background:#e6eee9;border-radius:22px;padding:25px;margin-bottom:18px}h1{font-size:28px;margin:8px 0}h2{font-size:22px}p{line-height:1.8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile,.panel{border:1px solid #e0e6e3;background:white;border-radius:19px;padding:20px}.tile{text-align:left;min-height:145px;font-size:18px;color:inherit}.tile b{display:block;margin:10px 0}.tile small{font-size:13px;color:#647784}.panel{margin-top:16px;padding:25px}.btn,.choice{display:block;width:100%;min-height:54px;padding:13px 16px;margin-top:10px;border:1px solid #ccd7d1;border-radius:13px;background:white;color:#263547;text-align:left;font:inherit;font-size:17px;cursor:pointer}.btn{background:#263e43;color:white;text-align:center;font-weight:700}.light{background:#e9eeeb;color:#263547}.question{font-size:23px;font-weight:700;line-height:1.6;margin:22px 0}.feedback{padding:16px;border-radius:14px;background:#eef3ee;margin:14px 0;line-height:1.8}.muted{color:#687b87;font-size:14px}.back{border:0;background:none;color:#526a68;font:inherit;text-decoration:underline;padding:10px 0}input{width:100%;font:inherit;font-size:17px;padding:13px;border:1px solid #ccd7d1;border-radius:12px}label{display:block;margin:16px 0 6px;font-weight:700}.footer{margin-top:25px;font-size:12px;color:#73818a;line-height:1.7}@media(max-width:560px){.grid{grid-template-columns:1fr}.tile{min-height:85px}.wrap{padding:18px 14px 45px}.hero,.panel{padding:20px}.question{font-size:21px}}</style></head><body><div class="wrap"><header>あかりのまなび ◦</header><main id="app"></main><div class="footer">おうちの人といっしょに使ってね。学習支援の試作版で、診断や評価を行うものではありません。記録はこの端末のブラウザ内だけに保存されます。</div></div><script>
const $=id=>document.getElementById(id),key='akari-learning-v1';let records=[];try{records=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}let s={mode:'home',i:0,step:0,hint:false,answer:null};
const words=[{q:'「りゆう」って、どんなこと？',opts:['どうしてそうなったか','どこにあるか','いくつあるか'],a:0,h:'「どうして？」にこたえるときに使うよ。',why:'「りゆう」は「どうして？」にこたえることばだね。'},{q:'「くらべる」って、どんなこと？',opts:['大きな声で読む','同じところやちがいを見る','順番に並べる'],a:1,h:'りんごとみかんを見くらべるとき、何を見るかな？',why:'同じところやちがうところを見つけることだよ。'},{q:'「よそうする」って、どんなこと？',opts:['これからどうなるか考える','前にしたことを思い出す','数を数える'],a:0,h:'明日の天気をよそうするって？',why:'これからどうなるかを考えることだね。'}];
const maths=[{text:'シールが 12まい あります。ともだちに 5まい あげました。のこりは なんまい？',steps:[{q:'はじめに なんまい あった？',opts:['12まい','5まい','7まい'],a:0,h:'はじめの文を見よう。',why:'はじめは12まいだね。'},{q:'シールは ふえた？ へった？',opts:['ふえた','へった'],a:1,h:'あげたら手もとの数は？',why:'あげたので、へったね。'},{q:'どんな しきに なる？',opts:['12＋5','12－5','5－12'],a:1,h:'へったときは、たし算かな？',why:'12－5＝7。のこりは7まい！'}]},{text:'あめが 8こ あります。おかあさんから 4こ もらいました。ぜんぶで なんこ？',steps:[{q:'はじめに なんこ あった？',opts:['4こ','8こ','12こ'],a:1,h:'もらう前はなんこ？',why:'はじめは8こだね。'},{q:'あめは ふえた？ へった？',opts:['ふえた','へった'],a:0,h:'もらったらどうなる？',why:'ふえたね。'},{q:'どんな しきに なる？',opts:['8－4','4－8','8＋4'],a:2,h:'ふえたときはどんなしき？',why:'8＋4＝12。ぜんぶで12こ！'}]}];
function log(kind,id,hint){records.push({kind,id,hint,time:Date.now()});try{localStorage.setItem(key,JSON.stringify(records))}catch(e){}}
function btn(t,fn,light=false){return '<button class="btn '+(light?'light':'')+'" onclick="'+fn+'">'+t+'</button>'}
function start(mode){s={mode,i:0,step:0,hint:false,answer:null};render()}function pick(i){s.answer=i;render()}function hint(){s.hint=true;render()}function next(){let mode=s.mode,i=s.i,step=s.step,h=s.hint;log(mode,i+'-'+step,h);if(mode==='math'&&step<maths[i].steps.length-1){s.step++}else{s.i++;s.step=0}s.answer=null;s.hint=false;render()}
function home(){let count=records.filter(r=>Date.now()-r.time<7*86400000).length;return '<div class="hero"><div class="muted">きょうも すこしずつ</div><h1>できた！を ふやそう。</h1><p>むずかしくても だいじょうぶ。<br>ひとつずつ かんがえよう。</p><div class="muted">この7日間にできたステップ：'+count+'こ</div></div><div class="grid"><button class="tile" onclick="start(\'word\')">💬<b>ことば</b><small>ことばの いみを かんがえる</small></button><button class="tile" onclick="start(\'math\')">🔎<b>さんすう</b><small>ぶんしょうを わけて かんがえる</small></button><button class="tile" onclick="start(\'diary\')">✏️<b>にっき</b><small>おもいでを ことばにする</small></button></div><div class="panel"><h2>おうちの人へ</h2><p>1回5〜10分ほど。速さよりも、ヒントで理解できたことを大切に。記録は端末ごとに保存され、別の端末とは同期しません。</p></div>'}
function quiz(){let math=s.mode==='math',arr=math?maths:words;if(s.i>=arr.length)return '<div class="panel"><h1>おつかれさま！ 🌱</h1><p>きょうも じっくり かんがえられたね。</p>'+btn('ホームへ',"start('home')")+'</div>';let item=arr[s.i],q=math?item.steps[s.step]:item,good=s.answer===q.a;return '<button class="back" onclick="start(\'home\')">← ホーム</button><div class="panel"><div class="muted">'+(math?'さんすう':'ことば')+' '+(s.i+1)+' / '+arr.length+(math?' ・ステップ '+(s.step+1)+' / '+item.steps.length:'')+'</div>'+(math?'<div class="feedback">'+item.text+'</div>':'')+'<div class="question">'+q.q+'</div>'+q.opts.map((x,i)=>'<button class="choice" onclick="pick('+i+')">'+x+(s.answer===i?' ✓':'')+'</button>').join('')+(s.hint?'<div class="feedback">💡 '+q.h+'</div>':'')+(s.answer!==null?'<div class="feedback">'+(good?q.why:'もういちど、ゆっくり かんがえてみよう。')+'</div>':'')+(!s.hint?btn('ヒントを みる','hint()',true):'')+(good?btn('つぎへ →','next()'):'')+'</div>'}
function diary(){return '<button class="back" onclick="start(\'home\')">← ホーム</button><div class="panel"><h2>きょうの できごと</h2><p>おうちの人と おはなししながら かいてみよう。</p>'+[['when','いつ？','にちようび'],['where','どこで？','こうえんで'],['who','だれと？','かぞくと'],['what','なにを した？','じてんしゃに のった'],['feel','どう おもった？','たのしかった']].map(x=>'<label for="'+x[0]+'">'+x[1]+'</label><input id="'+x[0]+'" placeholder="たとえば：'+x[2]+'" oninput="updateDiary()">').join('')+'<h2>まとめてみよう</h2><div class="feedback" id="diaryText">ことばを いれると ここに ぶんしょうが できるよ。</div>'+btn('ぶんしょうを コピー','copyDiary()',true)+btn('できた！','finishDiary()')+'</div>'}
function updateDiary(){let v=['when','who','where','what','feel'].map(x=>$(x).value.trim());$('diaryText').textContent=v.some(Boolean)?(v[0]||'あるひ')+'、'+(v[2]||'あるばしょで')+' '+(v[1]||'わたしは')+' '+(v[3]||'あそびました')+'。'+(v[4]||'たのしかったです')+'。':'ことばを いれると ここに ぶんしょうが できるよ。'}
function copyDiary(){let t=$('diaryText').textContent;if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('コピーしたよ！')).catch(()=>prompt('ここからコピーしてね',t));else prompt('ここからコピーしてね',t)}
function finishDiary(){log('diary',0,false);$('app').innerHTML='<div class="panel"><h1>にっきが できたね！ 🌷</h1><p>じぶんの ことばで つたえられたね。</p>'+btn('ホームへ',"start('home')")+'</div>'}
function render(){$('app').innerHTML=s.mode==='home'?home():s.mode==='diary'?diary():quiz()}render();
</script></body></html>
